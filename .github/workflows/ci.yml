name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: testing
      DATABASE_URL: sqlite:///./chargeshield.db
      JWT_SECRET_KEY: ci-test-jwt-secret-key-32-chars-long-abc
      SECRET_KEY: ci-test-app-secret-key-32-chars-long-abc
      CHARGESHIELD_WEBHOOK_SECRET: ci-test-webhook-secret-abc
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Database Migrations
        run: |
          python -m alembic upgrade head

      - name: Generate Synthetic Relational Dataset
        run: |
          python -c "from data.generator import SyntheticDataGenerator; SyntheticDataGenerator(seed=42).generate_dataset(num_customers=2500, dispute_rate=0.08, output_dir='data/generated')"

      - name: Execute Automated Test Suite (194 Tests)
        run: |
          python -m pytest -v

  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify TypeScript & Build Bundle
        working-directory: frontend
        run: npm run build
